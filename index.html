.grid{border-radius:14px}

:root{--bg:#f1f5ff;--ac:#2f6bff;--ac2:#ff5fa2;--ln:#dde5f5;--hl:#e6efff;--sh:0 2px 10px rgba(47,107,255,.12)}

.card .big{background:linear-gradient(120deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text}
main{padding-bottom:96px}
#tst{bottom:84px!important}
#bn{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--ln);box-shadow:0 -4px 16px rgba(47,107,255,.10)}

.bdg2{display:inline-block;min-width:20px;text-align:center;font-size:12px;font-weight:700;color:#fff;background:#ff3d7f;border-radius:999px;padding:0 7px;vertical-align:middle}
</style></head><body><div id="gt" style="max-width:900px;margin:0 auto;padding:12px"><p class="note">読み込み中…</p></div>
<main id="app" hidden>
<h1>大学祭 運営管理</h1>
<div id="mebar"></div><div id="ph"></div><div id="nbar"></div>
<div class="tabs"><button class="tab" id="t5" onclick="tab(5)">✅ タスク</button><button class="tab" id="t2" onclick="tab(2)">🙋 マイページ</button><button class="tab" id="t7" onclick="tab(7)">💰 予算</button><button class="tab" id="t6" onclick="tab(6)">📢 お知らせ</button><button class="tab" id="t4" onclick="tab(4)">✏️ 入力</button></div>
<div class="tabs"><span class="note" style="margin:0;align-self:center">当日シフト</span><button class="tab" id="t1" onclick="tab(1)">🗓️ 全体シフト</button><button class="tab" id="t3" onclick="tab(3)">🆘 ヘルプ募集</button></div>
<div class="row" id="ctl"><div class="seg" style="margin:0"><button id="d0" class="on" onclick="setDay(0)">1日目</button><button id="d1" onclick="setDay(1)">2日目</button></div>
<label>仮の現在時刻 <select id="ns" onchange="now=+this.value;draw()"></select></label></div>
<section id="v1"><div class="chips" id="chips"></div><div class="grid" id="grid"></div>
<p class="note">赤い線が現在時刻です。横にスクロールすると全時間帯を見られます。</p></section>
<section id="v2" hidden><div class="row"><label>名前 <select id="ps" onchange="person=+this.value;draw()"></select></label></div><div id="my"></div></section>
<section id="v3" hidden><div id="help"></div><p class="note">各マスは30分ごとの「必要人数 − 配置人数」です。赤い「+2」は2人不足、グレーの「OK」は足りています。必要人数を入れていない時間は空白です。</p></section>
<section id="v7" hidden><div id="bd"></div></section>
<section id="v6" hidden><div id="an"></div></section>
<section id="v5" hidden><div id="tk"></div><p class="note">タスクは期限の近い順に並びます。担当者を決めると、その人のマイページに表示されます。担当者を決めない場合は、その部門(または全体)のメンバー全員に表示されます。</p></section>
<section id="v4" hidden><div class="seg" id="sb" style="flex-wrap:wrap"></div><div class="note" id="mg"></div><div id="ed"></div>
<p class="note">入力した内容は保存され、全員の画面に反映されます。時間は9:00〜18:00の範囲で表示されます。</p></section>

</main>
<div id="tst" class="ann" hidden style="position:fixed;left:12px;right:12px;bottom:12px;z-index:9;margin:0"></div>
<script>
const K='shiftdb2',Dn=['受付','模擬店','ステージ','設営','警備','広報','会計','装飾','救護','運営本部'];
const T={受付:['来場者案内','パンフ配布'],模擬店:['調理補助','販売','在庫確認'],ステージ:['進行補助','音響確認'],設営:['テント設営','物品運搬'],警備:['会場巡回','駐輪場整理'],広報:['写真撮影','SNS投稿'],会計:['売上回収','釣銭準備'],装飾:['看板設置','装飾補修'],救護:['救護室待機','会場巡回'],運営本部:['連絡対応','物品管理']};
const L=['正門','中庭','体育館','講義棟前','本部テント'];
const N='佐藤 鈴木 高橋 田中 伊藤 渡辺 山本 中村 小林 加藤 吉田 山田 松本 井上 木村 林 清水 山口 斎藤 森 池田 橋本 阿部 石川 前田 藤田 小川 岡田 後藤 長谷川'.split(' ');
const G='陽 蒼 凛 結 葵 蓮 湊 紬 樹 楓 悠 澪 颯 栞 瑛 花 薫 光 彩 渚 響 咲 慧 玲 旭 茜 航 梓 駿 凪'.split(' ');
const r=s=>{s=Math.sin(s*9301+49297)*233280;return s-Math.floor(s)};
const f=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const tm=v=>{const a=(v||'').split(':');return a.length<2?null:+a[0]*60+ +a[1]};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function gen(p,dy){const o=[];let t=540+30*Math.floor(r(p.id*7+dy)*4),k=0;o.push([t,t+15,'集合','本部テント','m']);t+=15;
while(t<1050){if(k==2){o.push([t,t+60,'休憩','','b']);t+=60;k++;continue}
const e=Math.min(t+60+30*Math.floor(r(p.id*3+k+dy*11)*3),1080),tk=T[Dn[p.d]];o.push([t,e,tk[(k+dy)%tk.length],L[(p.id+k)%5],'w']);t=e;k++}return o}
function sample(){const db={D:Dn.map((n,i)=>({id:i,n})),P:N.map((n,i)=>({id:i,n:n+' '+G[i],d:i%10})),S:{},Q:{},nx:100};
db.P.sort((a,b)=>a.d-b.d);db.P.forEach(p=>[0,1].forEach(y=>db.S[p.id+'-'+y]=gen(p,y)));
Dn.forEach((_,d)=>[0,1].forEach(y=>db.Q[d+'-'+y]=[[540,720,3],[720,900,2],[900,1080,3]]));return db}
function load(){try{const s=localStorage.getItem(K);if(s){const d=JSON.parse(s);if(d&&d.D&&d.P)return d}}catch(e){}return sample()}
let DB={D:[],P:[],S:{},Q:{},K:[],A:[],B:[],bg:{},cf:0,ev:''},day=0,now=630,dept=-1,person=(DB.P[0]||{}).id,qd=(DB.D[0]||{}).id,cur=1,sub=0,msg='',arm='';const done=new Set();
const sv=()=>{persist();draw()};
const hu=id=>{const i=DB.D.findIndex(d=>d.id==id);return i<0?0:Math.round(i*360/DB.D.length)};
const dn=id=>(DB.D.find(d=>d.id==id)||{n:''}).n;
const dopts=s=>DB.D.map(d=>'<option value="'+d.id+'"'+(d.id==s?' selected':'')+'>'+esc(d.n)+'</option>').join('');
const popts=()=>DB.P.map(p=>'<option value="'+p.id+'"'+(p.id==person?' selected':'')+'>'+esc(p.n)+'('+esc(dn(p.d))+')</option>').join('');
const sorted=()=>DB.P.slice().sort((a,b)=>DB.D.findIndex(d=>d.id==a.d)-DB.D.findIndex(d=>d.id==b.d));
ns.innerHTML=Array.from({length:37},(_,i)=>'<option value="'+(540+i*15)+'"'+(540+i*15==630?' selected':'')+'>'+f(540+i*15)+'</option>').join('');
function tab(n){if(!ADMIN&&(n==4||n==7))n=5;cur=n;[1,2,3,4,5,6,7].forEach(i=>{document.getElementById('v'+i).hidden=n!=i;document.getElementById('t'+i).className='tab'+(n==i?' on':'')});draw()}
function setDay(n){day=n;d0.className=n?'':'on';d1.className=n?'on':'';draw()}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,signOut,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,getFirestore,doc,collection,onSnapshot,setDoc,getDoc,getDocs,deleteDoc,updateDoc,arrayUnion,writeBatch} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyCTK7ys9TMJuqQK3R1CgQuE-lo4sWNylxg",authDomain:"gakusai-task-schedule.firebaseapp.com",projectId:"gakusai-task-schedule",storageBucket:"gakusai-task-schedule.firebasestorage.app",messagingSenderId:"654102176669",appId:"1:654102176669:web:3f71a4e66ae9ddfc0b8574"};
const fbApp=initializeApp(cfg);
let db;try{db=initializeFirestore(fbApp,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=getFirestore(fbApp)}
const auth=getAuth(fbApp);
const D=p=>doc(db,...p.split('/'));
let unsubs=[],isAdm=false,viewerBusy=false;
const errL=e=>{console.error(e);toastMsg('読み込みに失敗しました。'+(e&&e.code==='permission-denied'?'権限がありません。':'通信状況を確認してください。'))};
function startSync(){gateLoading();
unsubs.push(onSnapshot(D('org/main'),s=>onOrgSnap(s.data()),errL));
unsubs.push(onSnapshot(collection(db,'tasks'),s=>onTasksSnap(s.docs.map(d=>d.data())),errL));
unsubs.push(onSnapshot(collection(db,'notices'),s=>onNoticesSnap(s.docs.map(d=>d.data())),errL));
unsubs.push(onSnapshot(collection(db,'shifts'),s=>{const m={};s.docs.forEach(d=>{m[d.id]=d.data()});onShiftSnap(m)},errL));
if(isAdm||VIEW){
unsubs.push(onSnapshot(D('budget/main'),s=>onBudgetSnap(s.data()),errL));
unsubs.push(onSnapshot(collection(db,'bentries'),s=>onBentries(s.docs.map(d=>d.data())),errL));
}
if(isAdm){
unsubs.push(onSnapshot(D('config/admins'),s=>onAdmins(s.data()),errL));
unsubs.push(onSnapshot(D('config/viewer'),s=>onViewerPw(s.data()),errL));
unsubs.push(onSnapshot(collection(db,'viewers'),s=>onViewers(s.docs.map(d=>Object.assign({uid:d.id},d.data()))),errL));
unsubs.push(onSnapshot(collection(db,'users'),s=>onUsers(s.docs.map(d=>Object.assign({uid:d.id},d.data()))),errL));}}
async function showRegister(msg){try{const o=await getDoc(D('org/main'));setOrgForGate(o.data());const c=await getDocs(collection(db,'claims'));gateRegister(c.docs.map(d=>+d.id),msg)}catch(e){gateLogin('読み込めませんでした: '+(e.code||e.message))}}
async function enter(u){let us;try{us=await getDoc(D('users/'+u.uid))}catch(e){gateLogin('読み込めませんでした: '+(e.code||e.message));return}
if(!us.exists()){setSession(-1,isAdm);await showRegister();return}
setSession(us.data().pid,isAdm);startSync()}
window.FB={
login:async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){if(e.code==='auth/popup-blocked'){gateLogin('ポップアップがブロックされました。Safariの設定でポップアップを許可するか、LINEなどのアプリ内ブラウザではなくSafari(またはChrome)でURLを開いて、もう一度押してください。');return}if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request'){gateLogin();return}gateLogin(e.code==='auth/unauthorized-domain'?'このアドレスはFirebaseで許可されていません。管理者に連絡してください。':'ログインできませんでした('+(e.code||e.message)+')')}},
viewerLogin:async pw=>{pw=(pw||'').trim();if(!pw){gateLogin('パスワードを入力してください。');return}viewerBusy=true;isAdm=false;gateLoading();
try{const c=await signInAnonymously(auth);await setDoc(D('viewers/'+c.user.uid),{pw:pw});viewerBusy=false;setView();startSync()}
catch(e){viewerBusy=false;console.error(e);try{await signOut(auth)}catch(_){}gateLogin(e.code==='permission-denied'?'パスワードが違います。':(e.code==='auth/operation-not-allowed'||e.code==='auth/admin-restricted-operation'?'閲覧機能がまだ有効になっていません(管理者の設定が必要です)。':'ログインできませんでした('+(e.code||e.message)+')'))}},
logout:()=>signOut(auth).then(()=>location.reload()),
set:(p,o)=>setDoc(D(p),o),
del:p=>deleteDoc(D(p)),
markRead:(id,pid)=>updateDoc(D('notices/'+id),{r:arrayUnion(pid)}),
register:async pid=>{const u=auth.currentUser;if(!u)return;try{const b=writeBatch(db);if(pid>=0)b.set(D('claims/'+pid),{uid:u.uid,email:u.email,at:Date.now()});b.set(D('users/'+u.uid),{email:u.email,pid:pid,at:Date.now()});await b.commit();await enter(u)}catch(e){console.error(e);await showRegister(e.code==='permission-denied'?'この名前はすでに使われています。別の名前を選ぶか、管理者に連絡してください。':'登録できませんでした。通信状況を確認してください。')}}
};
onAuthStateChanged(auth,async u=>{if(viewerBusy)return;unsubs.forEach(f=>f());unsubs=[];
if(!u){gateLogin();return}
if(u.isAnonymous){try{const v=await getDoc(D('viewers/'+u.uid));if(v.exists()){setView();startSync()}else{await signOut(auth)}}catch(e){gateLogin('読み込めませんでした: '+(e.code||e.message))}return}
gateLoading();isAdm=false;
try{await getDoc(D('config/admins'));isAdm=true}catch(e){if(e.code!=='permission-denied'){gateLogin('通信できませんでした。電波の良い場所で開き直してください。');return}}
await enter(u)});
</script></body></html>
